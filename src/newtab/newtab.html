<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- 书签栏 -->
  <div id="bookmarkBar" class="bookmark-bar">
    <div class="bookmark-bar-content" id="bookmarkBarContent">
      <!-- 动态填充 -->
    </div>
    <div class="bookmark-bar-actions">
      <button id="openSettings" class="bookmark-bar-btn" title="设置">
        <span>⚙️</span>
      </button>
    </div>
  </div>

  <div class="main-container">
    <!-- 内容区域 -->
    <div class="content">
      <!-- 打开的标签页 -->
      <section class="section">
        <div class="section-header">
          <h2>
            <span class="section-icon">
              <svg viewBox="-1.6 -5.2 35.2 43.2" fill="currentColor" x="0px" y="0px"><path d="M1.747,28.438H26.253V7.562H1.747ZM24.253,9.562V26.438H3.747V16.248H22.253v-2H3.747V9.562Z"/><rect x="4.857" y="10.905" width="2.109" height="2"/><rect x="8.021" y="10.905" width="2.11" height="2"/><rect x="11.186" y="10.905" width="2.109" height="2"/><polygon points="5.617 3.563 5.617 5.563 28.253 5.563 28.253 24.483 30.253 24.483 30.253 3.563 5.617 3.563"/></svg>
            </span>
            打开的窗口
            <span class="badge" id="windowsBadge">0</span>
          </h2>
          <input type="text" id="filterInput" class="filter-input" placeholder="过滤标签页...">
        </div>
        <div id="windowsContainer" class="windows-container">
          <!-- 动态填充 -->
        </div>
      </section>

      <!-- 工作区书签 -->
      <section class="section">
        <div class="section-header">
          <h2>
            <span class="section-icon">
              <svg viewBox="-1.6 -5.2 35.2 43.2" fill="currentColor" x="0px" y="0px"><path d="M16.789,7.451,13.3,3.9H2.688v24.21H29.313V7.451ZM27.313,26.105H4.688V5.9H12.46l3.489,3.556H27.313Z"/><rect x="17.846" y="3.895" width="8.493" height="2"/></svg>
            </span>
            书签文件夹
            <span class="badge" id="bookmarksBadge">0</span>
          </h2>
        </div>
        <div id="bookmarksContainer" class="bookmarks-container">
          <!-- 动态填充 -->
        </div>
      </section>
    </div>
  </div>
  
  <footer class="site-footer" aria-hidden="true"></footer>
  <script type="module" src="newtab.js"></script>
</body>
</html>
