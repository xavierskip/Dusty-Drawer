<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保存标签页</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="notice">新标签页等页面不属于快照部分</div>
    <div class="tab-list" id="tabList"></div>
    <div class="footer">
      <div class="folder-name-row" id="folderNameRow">
        <input type="text" id="folderName" placeholder="未分组文件夹名称（留空使用时间）">
      </div>
      <button id="saveBtn" class="snapshot-btn">
        <span class="icon">📸</span>
        快照：保存并关闭窗口
      </button>
    </div>
  </div>
  <div id="status" class="status"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
